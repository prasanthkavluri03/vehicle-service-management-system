{% extends 'base.html' %}

{% block title %}My Profile | AUTO-SERV{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="form-card shadow-lg">
            <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                <i class="fa-solid fa-address-card fa-3x text-warning"></i>
                <div>
                    <h3 class="fw-bold mb-0">My Profile Details</h3>
                    <p class="text-muted small mb-0">Manage your credentials, role classification, and address details.</p>
                </div>
            </div>
            
            <form method="post">
                {% csrf_token %}
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold small">Username (Read-Only)</label>
                        <input type="text" class="form-control bg-light" value="{{ user.username }}" readonly>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold small">Account Role (Read-Only)</label>
                        <input type="text" class="form-control bg-light text-capitalize" value="{{ user.get_role_display }}" readonly>
                    </div>
                </div>
                
                <div class="row">
                    {% for field in form %}
                    <div class="col-md-6 mb-3">
                        <label for="{{ field.id_for_label }}" class="form-label fw-semibold small">{{ field.label }}</label>
                        {{ field }}
                    </div>
                    {% endfor %}
                </div>
                
                <div class="mt-4 pt-3 border-top d-flex gap-3">
                    <button type="submit" class="btn btn-primary shadow-sm">
                        <i class="fa-solid fa-floppy-disk me-2"></i>Save Changes
                    </button>
                    <a href="{% url 'accounts:login_redirect' %}" class="btn btn-outline-secondary">
                        <i class="fa-solid fa-arrow-left me-2"></i>Back to Portal
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
