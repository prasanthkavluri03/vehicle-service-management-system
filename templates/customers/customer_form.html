{% extends 'base.html' %}

{% block title %}{{ title }} | AUTO-SERV{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="form-card shadow-lg">
            <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                <i class="fa-solid fa-user-pen fa-3x text-warning"></i>
                <div>
                    <h3 class="fw-bold mb-0">{{ title }}</h3>
                    <p class="text-muted small mb-0">Provide detailed contact details and addresses for the customer.</p>
                </div>
            </div>
            
            <form method="post">
                {% csrf_token %}
                
                <div class="row">
                    {% for field in form %}
                    <div class="col-md-12 mb-3">
                        <label for="{{ field.id_for_label }}" class="form-label fw-semibold small">{{ field.label }}</label>
                        {{ field }}
                    </div>
                    {% endfor %}
                </div>
                
                <div class="mt-4 pt-3 border-top d-flex gap-3">
                    <button type="submit" class="btn btn-primary shadow-sm">
                        <i class="fa-solid fa-floppy-disk me-2"></i>Save Customer
                    </button>
                    <a href="{% url 'customers:customer_list' %}" class="btn btn-outline-secondary">
                        <i class="fa-solid fa-arrow-left me-2"></i>Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
