<nav class="navbar navbar-expand-lg main-navbar py-2 px-3 mb-3 no-print">
    <div class="container-fluid">
        <!-- Brand displayed only if sidebar not present (i.e. not logged in) -->
        {% if not user.is_authenticated %}
        <a class="navbar-brand text-dark fw-bold d-flex align-items-center" href="/">
            <i class="fa-solid fa-gear me-2 brand-gear fs-4"></i>AUTO-<span style="color:var(--primary-color);">SERV</span>
        </a>
        {% else %}
        <span class="navbar-brand text-muted fs-6 d-none d-md-inline fw-semibold">
            <i class="fa-solid fa-screwdriver-wrench me-2" style="color:var(--primary-color);"></i> Vehicle Service Management System
        </span>
        {% endif %}

        <div class="ms-auto d-flex align-items-center">
            {% if user.is_authenticated %}
            <div class="text-dark me-3 d-none d-sm-flex align-items-center">
                <span class="status-dot dot-active me-2"></span>
                <span class="small me-2">Welcome, <strong class="text-dark">{{ user.first_name|default:user.username }} {{ user.last_name }}</strong></span>
                <span class="badge bg-dark rounded-pill px-3 py-1 font-monospace" style="letter-spacing: 0.5px;">{{ user.get_role_display }}</span>
            </div>
            <a href="{% url 'accounts:profile' %}" class="btn btn-sm btn-outline-secondary me-2">
                <i class="fa-solid fa-user-circle"></i> Profile
            </a>
            {% else %}
            <a href="{% url 'accounts:login' %}" class="btn btn-sm btn-outline-dark me-2 px-3">
                <i class="fa-solid fa-arrow-right-to-bracket me-1"></i> Login
            </a>
            <a href="{% url 'accounts:register' %}" class="btn btn-sm btn-primary px-3 shadow-sm">
                <i class="fa-solid fa-user-plus me-1"></i> Sign Up
            </a>
            {% endif %}
        </div>
    </div>
</nav>
