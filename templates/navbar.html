<nav class="navbar navbar-expand-lg main-navbar rounded shadow-sm py-2 px-3 no-print">
    <div class="container-fluid">
        <!-- Brand displayed only if sidebar not present (i.e. not logged in) -->
        {% if not user.is_authenticated %}
        <a class="navbar-brand text-dark fw-bold d-flex align-items-center" href="/">
            <i class="fa-solid fa-gears me-2 text-warning"></i>AUTO-SERV
        </a>
        {% else %}
        <span class="navbar-brand text-muted fs-6 d-none d-md-inline">
            <i class="fa-solid fa-bars me-2"></i> Vehicle Service Management System
        </span>
        {% endif %}

        <div class="ms-auto d-flex align-items-center">
            {% if user.is_authenticated %}
            <span class="text-dark me-3 d-none d-sm-inline">
                Welcome, <strong>{{ user.first_name }} {{ user.last_name }}</strong> 
                <span class="badge bg-dark ms-1">{{ user.get_role_display }}</span>
            </span>
            <a href="{% url 'accounts:profile' %}" class="btn btn-sm btn-outline-secondary me-2">
                <i class="fa-solid fa-user-circle"></i> Profile
            </a>
            {% else %}
            <a href="{% url 'accounts:login' %}" class="btn btn-outline-dark me-2">Login</a>
            <a href="{% url 'accounts:register' %}" class="btn btn-primary">Sign Up</a>
            {% endif %}
        </div>
    </div>
</nav>
